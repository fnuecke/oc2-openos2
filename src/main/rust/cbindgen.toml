language = "C"
style = "tag"
include_guard = "KERNEL_H"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
usize_is_size_t = true
cpp_compat = true
documentation_style = "doxy"
header = """/* SPDX-License-Identifier: MIT */
/*
 * This file is automatically generated by cbindgen.
 * It is not intended for manual editing.
 */"""

[export]
include = ["Error", "Medium"]

[export.rename]
"Error" = "FS"
"Medium" = "FS_MEDIUM"
"Kind" = "FS_KIND"
"Stat" = "fs_stat"
"Listing" = "fs_listing"
"ListEntry" = "fs_list_entry"
"MountEntry" = "fs_mount"
"Signal" = "signal"
"InterruptHandler" = "interrupt_handler"
"PATH_LENGTH" = "FS_PATH_LENGTH"
"LABEL_LENGTH" = "FS_LABEL_LENGTH"
"O_READ" = "FS_O_READ"
"O_WRITE" = "FS_O_WRITE"
"O_CREATE" = "FS_O_CREATE"
"O_TRUNCATE" = "FS_O_TRUNCATE"
"O_APPEND" = "FS_O_APPEND"
"O_NONBLOCK" = "FS_O_NONBLOCK"
"POLL_IN" = "FS_POLL_IN"
"POLL_OUT" = "FS_POLL_OUT"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
no_return = "__attribute__((noreturn))"
